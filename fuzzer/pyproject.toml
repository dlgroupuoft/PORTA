[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valence"
version = "0.1.0"
description = "VALENCE: Oracle-guided identity broker fuzzer"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "PyJWT[crypto]>=2.8.0",
    "cryptography>=41.0.0",
    "lxml>=4.9.0",
    "signxml>=3.2.0",
    "docker>=7.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-timeout>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
markers = [
    "integration: requires a live Vault instance",
    "llm: requires an LLM API key",
]
