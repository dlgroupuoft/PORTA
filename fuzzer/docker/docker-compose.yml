version: '3.8'

services:
  vault:
    image: hashicorp/vault:1.21.4
    container_name: valence-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_API_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    networks:
      - valence-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    container_name: valence-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
    command: start-dev
    ports:
      - "8080:8080"
    networks:
      - valence-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  dex:
    image: ghcr.io/dexidp/dex:v2.46.0
    container_name: valence-dex
    command: dex serve /etc/dex/config.yaml
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"
      - "5557:5557"
    networks:
      - valence-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5556/dex/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  openldap:
    image: osixia/openldap:1.5.0
    container_name: valence-openldap
    environment:
      LDAP_ORGANISATION: valence
      LDAP_DOMAIN: valence.local
      LDAP_ADMIN_PASSWORD: admin
    ports:
      - "389:389"
    volumes:
      - ./openldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/seed.ldif:ro
    networks:
      - valence-net
    command: --copy-service

  mock-idp:
    build:
      context: ./mock-idp
      dockerfile: Dockerfile
    container_name: valence-mock-idp
    ports:
      - "9090:9090"
    networks:
      - valence-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  valence-net:
    driver: bridge
