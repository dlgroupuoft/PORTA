issuer: http://localhost:5556/dex

storage:
  type: sqlite3
  config:
    file: /tmp/dex.db

web:
  http: 0.0.0.0:5556

grpc:
  addr: 0.0.0.0:5557

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: valence-test-client
    secret: valence-test-secret
    name: VALENCE Test Client
    redirectURIs:
      - http://localhost:8080/callback
      - http://localhost:9090/callback

connectors:
  - type: mockCallback
    id: mock
    name: Mock

  - type: saml
    id: test-saml
    name: Test SAML IdP
    config:
      ssoURL: http://mock-idp:9090/saml/sso
      ca: /etc/dex/saml_idp_cert.pem
      redirectURI: http://localhost:5556/dex/callback
      usernameAttr: email
      emailAttr: email
      groupsAttr: groups
      nameIDPolicyFormat: emailAddress
