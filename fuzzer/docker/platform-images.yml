# =============================================================================
# Platform Images — Pre-built, no docker build needed
#
# Usage:
#   docker compose -f docker/platform-images.yml --profile keycloak up -d
#   docker compose -f docker/platform-images.yml --profile vault up -d
#   docker compose -f docker/platform-images.yml --profile all up -d
#
# All platforms use official images. No build step.
# Stop + remove container = clean state. Image stays cached.
# =============================================================================

networks:
  valence-net:
    driver: bridge

services:
  # ── Vault ──────────────────────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.21.4
    profiles: ["vault", "all"]
    ports: ["8200:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add: [IPC_LOCK]
    networks: [valence-net]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Keycloak ───────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    profiles: ["keycloak", "all"]
    ports: ["8080:8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /
    command: start-dev
    networks: [valence-net]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ── Dex ────────────────────────────────────────────────────────────────
  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    profiles: ["dex", "all"]
    ports: ["5556:5556", "5557:5557"]
    volumes:
      - ./dex/config.docker.yaml:/etc/dex/config.docker.yaml:ro
      - ./dex/saml_idp_cert.pem:/etc/dex/saml_idp_cert.pem:ro
      - ./dex/saml_idp_key.pem:/etc/dex/saml_idp_key.pem:ro
    command: ["dex", "serve", "/etc/dex/config.docker.yaml"]
    networks: [valence-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5556/dex/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Casdoor  ──────────────────────
  casdoor-db:
    image: mysql:8.0.25
    profiles: ["casdoor", "all"]
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
    networks: [valence-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No volume — clean state on every restart

  casdoor:
    image: casbin/casdoor:2.362.0
    profiles: ["casdoor", "all"]
    ports: ["8000:8000"]
    depends_on:
      casdoor-db:
        condition: service_healthy
    environment:
      RUNNING_IN_DOCKER: "true"
    entrypoint: /bin/sh -c './server --createDatabase=true'
    volumes:
      - ./casdoor/app.conf:/conf/app.conf:ro
    networks: [valence-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  # ── Logto ──────────────────────────────────────────────────────────────
  logto-db:
    image: postgres:17.9-alpine
    container_name: logto-postgres
    profiles: ["logto", "all"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: p0stgr3s
      POSTGRES_DB: logto
    networks: [valence-net]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      timeout: 2s
      retries: 10
    # No volume — clean state on every restart

  logto:
    image: svhd/logto:1.37.1
    profiles: ["logto", "all"]
    ports: ["3001:3001", "3002:3002"]
    depends_on:
      logto-db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    environment:
      DB_URL: postgres://postgres:p0stgr3s@logto-postgres:5432/logto
      ENDPOINT: http://localhost:3001
      ADMIN_ENDPOINT: http://localhost:3002
    networks: [valence-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3001/oidc/.well-known/openid-configuration || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ── Authentik ──────────────────────────────────────────────────────────
  authentik-db:
    image: postgres:16.13-alpine
    profiles: ["authentik", "all"]
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik_pass
      POSTGRES_DB: authentik
    networks: [valence-net]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "authentik"]
      interval: 3s
      timeout: 2s
      retries: 10

  authentik-redis:
    image: redis:7.4.7-alpine
    profiles: ["authentik", "all"]
    networks: [valence-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  authentik:
    image: ghcr.io/goauthentik/server:2026.2.1
    profiles: ["authentik", "all"]
    ports: ["9000:9000"]
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: valence-test-secret-key-change-me
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik_pass
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_BOOTSTRAP_TOKEN: valence-bootstrap-token
      AUTHENTIK_BOOTSTRAP_PASSWORD: admin
    command: server
    networks: [valence-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/api/v3/root/config/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  # ── Zitadel ────────────────────────────────────────────────────────────
  zitadel-db:
    image: postgres:16.13-alpine
    profiles: ["zitadel", "all"]
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: zitadel_pass
      POSTGRES_DB: zitadel
    networks: [valence-net]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "zitadel"]
      interval: 3s
      timeout: 2s
      retries: 10

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.13.0
    profiles: ["zitadel", "all"]
    ports: ["8085:8080"]
    depends_on:
      zitadel-db:
        condition: service_healthy
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel_pass
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: zitadel_pass
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8085
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_MASTERKEY: "x]Fjs(Cl0i~5<-eDNV@Eey9ihWP.!t0y"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: "Admin1234!"
      # Auto-create service account with PAT for API access
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: valence-admin-sa
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: "VALENCE Admin Service Account"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /data/pat/zitadel-admin.pat
    user: root
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    volumes:
      - zitadel-pat:/data/pat
    networks: [valence-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/debug/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40

  # ── Mock IdP (lightweight, no build needed if image exists) ────────────
  mock-idp:
    image: valence/mock-idp:latest
    profiles: ["mock-idp", "vault", "dex", "logto", "all"]
    ports: ["9090:9090"]
    networks: [valence-net]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:9090/health\")'"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zitadel-pat:
